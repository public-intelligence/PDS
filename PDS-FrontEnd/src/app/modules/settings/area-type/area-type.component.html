<app-crud-page>
  <button slot="actions" type="button" (click)="openCreateModal()" class="btn-primary">
    <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14m-7-7h14" />
    </svg>
    Nuevo tipo
  </button>

  <app-table-filter
    slot="filter"
    searchPlaceholder="Buscar por nombre..."
    selectLabel="Orden"
    [selectOptions]="orderOptions()"
    (searchChange)="onSearch($event)"
    (selectChange)="onSelectChange($event)"
  />

  <app-table
    slot="table"
    [headers]="headers"
    [columnData]="filteredData()"
    [isLoading]="isLoading()"
    noDataDescription="No hay tipos de área registrados"
  />

  <app-paginator
    slot="pagination"
    [pageNumber]="pageNumber()"
    [totalCount]="totalCount()"
    [totalPages]="totalPages()"
    [pageSizeInput]="pageSize()"
    (pageToEmit)="onPageChange($event)"
    (pageSize)="onPageSizeChange($event)"
  />
</app-crud-page>

<app-area-type-modal
  [isOpen]="isModalOpen()"
  [areaType]="selectedAreaType()"
  (saved)="onModalSaved()"
  (closed)="onModalClosed()"
/>

<app-confirmation-modal />
