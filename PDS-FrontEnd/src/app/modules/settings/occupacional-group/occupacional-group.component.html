<app-crud-page [showFilters]="false" [showActions]="false">
  <app-table
    slot="table"
    [headers]="headers"
    [columnData]="allData()"
    [isLoading]="isLoading()"
    noDataDescription="No hay grupos ocupacionales registrados"
    [actions]="false"
  />
  <app-paginator
    slot="pagination"
    [pageNumber]="pageNumber()"
    [totalCount]="totalCount()"
    [totalPages]="totalPages()"
    [pageSizeInput]="pageSize()"
    (pageToEmit)="onPageChange($event)"
    (pageSize)="onPageSizeChange($event)"
  />
</app-crud-page>

<app-confirmation-modal />
