<app-custom-modal
  [isOpen]="isOpen()"
  [title]="title"
  size="sm"
  [closeOnBackdrop]="false"
  (closed)="closeModal()"
>
  <div class="flex flex-col items-center gap-4 text-center">
    <span
      class="grid size-12 place-items-center rounded-full"
      [class]="isDelete ? 'bg-error-bg text-error' : 'bg-warning-bg text-warning'"
    >
      @if (isDelete) {
        <svg class="size-6" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M8.75 1a1 1 0 0 0-.96.73L7.42 3H4a1 1 0 0 0 0 2h.06l.81 11.32A2 2 0 0 0 6.86 18h6.28a2 2 0 0 0 1.99-1.68L15.94 5H16a1 1 0 1 0 0-2h-3.42l-.37-1.27A1 1 0 0 0 11.25 1h-2.5ZM8.5 7.5a.75.75 0 0 1 1.5 0v6a.75.75 0 0 1-1.5 0v-6Zm3.5-.75a.75.75 0 0 0-.75.75v6a.75.75 0 0 0 1.5 0v-6a.75.75 0 0 0-.75-.75Z"
            clip-rule="evenodd"
          />
        </svg>
      } @else {
        <svg class="size-6" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
            clip-rule="evenodd"
          />
        </svg>
      }
    </span>

    <p class="text-sm text-ink-muted">
      ¿{{ paragraph }} <strong class="text-ink">{{ name }}</strong>?
    </p>

    @if (warning !== '') {
      <p class="w-full rounded-lg border border-warning-border bg-warning-bg px-3 py-2 text-sm text-warning-text">
        {{ warning }}
      </p>
    }
  </div>

  <div modal-actions class="flex justify-end gap-3 border-t border-border px-6 py-4">
    <button type="button" class="btn-ghost" (click)="closeModal()">Cancelar</button>
    <button
      type="button"
      [class]="isDelete ? 'btn-danger' : 'btn-primary'"
      (click)="onConfirm()"
    >
      {{ confirmButton }}
    </button>
  </div>
</app-custom-modal>
