<app-custom-modal
  [isOpen]="isOpen()"
  [title]="isEdit ? 'Editar función de localidad' : 'Nueva función de localidad'"
  size="md"
  [closeOnBackdrop]="false"
  (closed)="onClose()"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
    <app-custom-input formControlName="codigo" label="Código" [required]="true" [errorMessage]="codigoError" />
    <app-custom-input formControlName="nombre" label="Nombre" [required]="true" [errorMessage]="nombreError" />
    <app-custom-select formControlName="categoria" label="Categoría" [required]="true" [options]="categoriaOptions" [errorMessage]="categoriaError" />
    <app-custom-textarea formControlName="descripcion" label="Descripción" [rows]="2" />
    <div modal-actions class="flex justify-end gap-3 border-t border-border px-6 py-4">
      <button type="button" class="btn-ghost" (click)="onClose()">Cancelar</button>
      <button type="submit" class="btn-primary" [disabled]="isSaving()">{{ isEdit ? 'Guardar' : 'Crear' }}</button>
    </div>
  </form>
</app-custom-modal>
