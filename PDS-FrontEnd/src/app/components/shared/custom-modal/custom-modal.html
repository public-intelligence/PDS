@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="title() ? titleId() : null"
    [attr.aria-label]="title() ? null : 'Diálogo'"
  >
    <!-- Backdrop -->
    <div
      class="fade-in absolute inset-0 bg-slate-900/50 backdrop-blur-sm"
      (click)="onBackdropClick()"
      aria-hidden="true"
    ></div>

    <!-- Panel -->
    <div [class]="panelClasses()">
      <!-- Header -->
      @if (title() || showCloseButton()) {
        <div class="flex items-center justify-between gap-4 border-b border-border px-6 py-4">
          @if (title()) {
            <h2 [id]="titleId()" class="font-poppins text-lg font-semibold text-ink-heading">
              {{ title() }}
            </h2>
          }
          @if (showCloseButton()) {
            <button type="button" (click)="close()" class="btn-icon ml-auto" aria-label="Cerrar">
              <svg class="size-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path
                  d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22z"
                />
              </svg>
            </button>
          }
        </div>
      }

      <div class="relative flex min-h-0 flex-1 flex-col" [attr.aria-busy]="isLoading()">
        <!-- Body -->
        <div class="custom-scrollbar flex-1 overflow-y-auto px-6 py-5 text-ink">
          <ng-content />
        </div>

        <!-- Footer / Actions -->
        <ng-content select="[modal-actions]" />

        @if (isLoading()) {
          <div
            class="fade-in absolute inset-0 z-50 flex items-center justify-center rounded-b-xl bg-surface-raised/80"
            role="status"
            aria-label="Cargando"
          >
            <span class="loader"></span>
          </div>
        }
      </div>
    </div>
  </div>
}
