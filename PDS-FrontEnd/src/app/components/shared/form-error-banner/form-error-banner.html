@if (message()) {
  <div
    role="alert"
    class="flex items-center justify-between gap-3 rounded-lg border border-error-border bg-error-bg px-3 py-2 text-sm text-error-text"
  >
    <span>{{ message() }}</span>
    @if (canReload()) {
      <button type="button" class="btn-secondary btn-sm shrink-0" (click)="reload.emit()">
        Recargar
      </button>
    }
  </div>
}
