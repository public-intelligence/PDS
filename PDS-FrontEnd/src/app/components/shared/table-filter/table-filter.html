<div class="flex flex-wrap items-end gap-3">

  <div class="relative min-w-[220px] flex-1">
    @if (selectLabel()) {
      <span class="mb-1.5 block text-xs font-medium text-ink-subtle">
        &nbsp;
      </span>
    }
    <div class="relative">
      <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-ink-subtle">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor" class="h-4 w-4">
          <path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/>
        </svg>
      </span>
      <input
        type="text"
        [ngModel]="inputValue()"
        (ngModelChange)="onInputChange($event)"
        (keyup.enter)="onSearch()"
        [placeholder]="searchPlaceholder()"
        aria-label="Buscar"
        class="field-control pl-9"
      />
    </div>
  </div>

  <button
    type="button"
    (click)="onSearch()"
    class="flex items-center gap-1.5 rounded-lg bg-primary-blue px-4 py-2 text-sm font-medium text-white transition-colors duration-200 hover:bg-primary-blue-dark cursor-pointer"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor" class="h-4 w-4">
      <path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/>
    </svg>
    Buscar
  </button>

  @if (selectOptions().length > 0) {
    <div class="min-w-[180px]">
      @if (selectLabel()) {
        <span class="mb-1.5 block text-xs font-medium text-ink-subtle">
          {{ selectLabel() }}
        </span>
      }
      <div class="relative">
        <select
          [ngModel]="selectValue()"
          (ngModelChange)="onSelectChange($event)"
          [attr.aria-label]="selectLabel() || selectPlaceholder()"
          class="field-control cursor-pointer appearance-none pr-9"
        >
          <option value="">{{ selectPlaceholder() }}</option>
          @for (option of selectOptions(); track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-ink-subtle">
          <svg class="h-4 w-4" viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06z"/>
          </svg>
        </div>
      </div>
    </div>
  }

  @if (hasActiveFilters) {
    <button
      (click)="clearFilters()"
      type="button"
      class="btn-secondary gap-1.5"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" fill="currentColor" class="h-3.5 w-3.5">
        <path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/>
      </svg>
      Limpiar
    </button>
  }

</div>
